name: 星驰 API 登录签到
description: 直接导入本模块即可自动下载配套脚本；网页登录一次获取会话，每日 09:00 自动刷新登录并签到。
icon: checkmark.seal.fill
open_url: https://xingchiapi.com/
scriptings:
  - http_request:
      name: 星驰 API 获取登录请求
      match: '^https://xingchiapi\.com/api/v1/auth/me(?:\?|$)'
      script_url: https://raw.githubusercontent.com/ZHT0711/xingchi-api-loon-egern/refs/heads/main/xingchi.egern.js
      timeout: 10
      body_required: false
  - http_response:
      name: 星驰 API 获取登录响应
      match: '^https://xingchiapi\.com/api/v1/auth/'
      script_url: https://raw.githubusercontent.com/ZHT0711/xingchi-api-loon-egern/refs/heads/main/xingchi.egern.js
      timeout: 10
      body_required: true
      max_size: 1048576
  - schedule:
      name: 星驰 API 每日登录签到
      cron: '0 9 * * *'
      script_url: https://raw.githubusercontent.com/ZHT0711/xingchi-api-loon-egern/refs/heads/main/xingchi.egern.js
      timeout: 180
  - generic:
      name: 星驰 API 手动签到
      script_url: https://raw.githubusercontent.com/ZHT0711/xingchi-api-loon-egern/refs/heads/main/xingchi.egern.js
      timeout: 180
mitm:
  hostnames:
    includes:
      - xingchiapi.com
